name: leak-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  leak-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Generic secret-shape backstop. This repo is generated from Primer's
      # private source of truth, which runs the authoritative internal-content
      # gate before publishing; this is a second line against a hand-edit or a
      # bad publish leaking a universally-recognizable secret.
      - name: Secret scan
        run: bash .github/public-secret-scan.sh .
      - name: Validate manifests and skill frontmatter
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          fail = []
          mp = json.load(open('.claude-plugin/marketplace.json'))
          for p in mp['plugins']:
              src = pathlib.Path(p['source'])
              man = json.load(open(src / '.claude-plugin' / 'plugin.json'))
              if man['name'] != p['name']:
                  fail.append(f"name mismatch: {man['name']} vs {p['name']}")
              for skill in (src / 'skills').iterdir():
                  head = (skill / 'SKILL.md').read_text().split('---')[1]
                  if f"name: {skill.name}" not in head:
                      fail.append(f"frontmatter name != dir name in {skill}")
                  if 'description:' not in head:
                      fail.append(f"no description in {skill}")
          print('\n'.join(fail) if fail else 'manifests OK')
          sys.exit(1 if fail else 0)
          PY
      - name: CLI smoke test
        run: python3 plugins/primer-targeting/skills/audience-refiner/bin/primer --help
